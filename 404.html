<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | OpenCandle</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1a1d26">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<style>
:root{--bg:#1a1d26;--surface:#232734;--border:#3a4052;--text:#e3e6ee;--text-2:#a0a7b8;--accent:#3cc0cf;--accent-hover:#5ccfdc;--accent-ink:#0f2a30;--radius:8px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","Trebuchet MS",Roboto,Ubuntu,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:16px/1.6 var(--font);padding:24px;text-align:center}
main{max-width:520px}
img{display:block;margin:0 auto 20px}
h1{font-size:clamp(28px,5vw,40px);margin:0 0 8px}
p{color:var(--text-2);margin:0 0 24px}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 20px;border-radius:var(--radius);font-weight:600;text-decoration:none;background:var(--accent);color:var(--accent-ink)}
a.btn:hover{background:var(--accent-hover)}
a.btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
</style>
</head>
<body>
<main>
  <img src="/assets/logo-160.png" alt="OpenCandle logo" width="80" height="80">
  <h1>Page not found</h1>
  <p>That page does not exist. It may have moved, or the link may be mistyped.</p>
  <a class="btn" href="/">Back to OpenCandle</a>
</main>
</body>
</html>
